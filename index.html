<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 <div class="card">

     <header class="card-header">
        <h2>
             <img src="usuario.png" alt="Ícone usuário" class="icone-usuario">
            Sistema de Notas        
         </h2>
     </header>

     <div class="card-body">
         <h4 class="descricao">Informe os dados do aluno para verificar se foi aprovado ou reprovado.</h4>

         <label for="nome">Nome do Aluno: </label>
         <input type="text" id="nome" placeholder="Ex: Rodrigo">

         <label for="nota">Nota do Aluno: </label>
    
         <input type="number" id="nota" step="0.1" min="0" max="10" placeholder="Ex: 7.0">

         <button id="btnverificar">Verificar Resultado</button>

         <input type="text" id="resultado" placeholder="Resultado aparecerá aqui" readonly>
         <hr>

         <div id="regras">
           <h4>Regra de Aprovação: </h4>
            <ul>
              <li>Média mínima de Aprovação: 7,0</li>
            </ul>
         </div>
         
     </div>
 </div>
 <script src="script.js"></script>
</body>
</html>
